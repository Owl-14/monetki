name: Применить расписание синхронизации Точка Банка

# Запуск разрешён только вручную после отдельного ревью.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-migration:
    name: Применить миграцию и проверить cron
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v4

      - name: Применить миграцию и проверить результат
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          umask 077

          : "${SUPABASE_ACCESS_TOKEN:?Не задан SUPABASE_ACCESS_TOKEN}"
          : "${SUPABASE_PROJECT_ID:?Не задан SUPABASE_PROJECT_ID}"

          migration_files=(
            "supabase/migrations/002_schedule_tochka_sync.sql"
            "supabase/migrations/003_tochka_sync_lease.sql"
            "supabase/migrations/004_process_bank_transaction.sql"
          )
          api_url="https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/database/query"
          request_file="${RUNNER_TEMP}/migration-request.json"
          response_file="${RUNNER_TEMP}/migration-response.json"

          migration_query=""
          for migration_file in "${migration_files[@]}"; do
            test -s "${migration_file}"
            migration_query+="$(<"${migration_file}")"$'\n'
          done
          jq -n --arg query "${migration_query}" '{query: $query}' > "${request_file}"

          status_code="$(curl --silent --show-error \
            --output "${response_file}" \
            --write-out '%{http_code}' \
            --request POST \
            --url "${api_url}" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary "@${request_file}")"

          if [[ "${status_code}" != "201" ]]; then
            echo "Не удалось применить миграцию: Management API вернул HTTP ${status_code}." >&2
            exit 1
          fi

          verification_query="select (select count(*) from pg_proc where proname in ('acquire_tochka_sync_lease', 'release_tochka_sync_lease'))::integer as lease_function_count, count(*) filter (where active)::integer as active_job_count, count(*) filter (where active and schedule = '5 * * * *' and position('vault.decrypted_secrets' in command) > 0 and position('X-Tochka-Sync-Secret' in command) > 0)::integer as scheduled_job_count from cron.job where jobname = 'tochka-sync-hourly';"
          verification_request="${RUNNER_TEMP}/verification-request.json"
          verification_response="${RUNNER_TEMP}/verification-response.json"

          jq -n --arg query "${verification_query}" '{query: $query}' > "${verification_request}"

          verification_status="$(curl --silent --show-error \
            --output "${verification_response}" \
            --write-out '%{http_code}' \
            --request POST \
            --url "${api_url}" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary "@${verification_request}")"

          if [[ "${verification_status}" != "201" ]]; then
            echo "Не удалось проверить cron: Management API вернул HTTP ${verification_status}." >&2
            exit 1
          fi

          if ! jq -e '
            type == "array" and
            length == 1 and
            (.[0].lease_function_count | tonumber) == 2 and
            (.[0].active_job_count | tonumber) == 1 and
            (.[0].scheduled_job_count | tonumber) == 1
          ' "${verification_response}" > /dev/null; then
            echo "Проверка не пройдена: ожидается ровно одна защищённая задача tochka-sync-hourly с расписанием 5 * * * *." >&2
            exit 1
          fi

          echo "Миграция применена, расписание cron подтверждено."
