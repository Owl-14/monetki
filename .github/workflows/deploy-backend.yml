name: Deploy backend (Supabase)

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/003_tochka_sync_lease.sql"
      - "supabase/migrations/004_atomic_stock_operations.sql"
      - "supabase/migrations/005_process_bank_transaction.sql"
      - "supabase/migrations/006_recover_hidden_bank_transactions.sql"
      - "supabase/migrations/007_atomic_event_finance.sql"
      - "supabase/migrations/008_event_review_guarantees.sql"
      - "supabase/migrations/009_bank_rules.sql"
      - "supabase/config.toml"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Применить серверные миграции
        shell: bash
        run: |
          set -euo pipefail
          migration_files=(
            "supabase/migrations/003_tochka_sync_lease.sql"
            "supabase/migrations/004_atomic_stock_operations.sql"
            "supabase/migrations/005_process_bank_transaction.sql"
            "supabase/migrations/006_recover_hidden_bank_transactions.sql"
            "supabase/migrations/007_atomic_event_finance.sql"
            "supabase/migrations/008_event_review_guarantees.sql"
            "supabase/migrations/009_bank_rules.sql"
          )
          database_url="https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}/database/query"
          request_file="${RUNNER_TEMP}/tochka-lease-migration-request.json"
          response_file="${RUNNER_TEMP}/tochka-lease-migration-response.json"
          migration_query=""
          for migration_file in "${migration_files[@]}"; do
            test -s "${migration_file}"
            migration_query+="$(<"${migration_file}")"$'\n'
          done
          jq -n --arg query "${migration_query}" '{query: $query}' > "${request_file}"
          status_code="$(curl --silent --show-error \
            --output "${response_file}" \
            --write-out '%{http_code}' \
            --request POST \
            --url "${database_url}" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary "@${request_file}")"
          if [[ "${status_code}" != "201" ]]; then
            echo "Не удалось применить серверные миграции: Management API вернул HTTP ${status_code}." >&2
            exit 1
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      - name: Deploy api function
        run: supabase functions deploy api --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      - name: Deploy map function
        run: supabase functions deploy map --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
