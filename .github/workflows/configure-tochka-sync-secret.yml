name: Настроить или ротировать секрет синхронизации Точки

# Запуск разрешён только вручную после отдельного ревью.
on:
  workflow_dispatch:

concurrency:
  group: configure-tochka-sync-secret
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  configure-secret:
    name: Обновить Edge secret, Vault и cron
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v4

      - name: Сгенерировать и безопасно установить секрет
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          umask 077

          : "${SUPABASE_ACCESS_TOKEN:?Не задан SUPABASE_ACCESS_TOKEN}"
          : "${SUPABASE_PROJECT_ID:?Не задан SUPABASE_PROJECT_ID}"

          management_url="https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_ID}"
          database_url="${management_url}/database/query"

          vault_query="do \$vault\$
          declare
            existing_id uuid;
            generated_secret text := encode(extensions.gen_random_bytes(32), 'hex');
          begin
            select id into existing_id from vault.secrets where name = 'tochka_sync_secret';
            if existing_id is null then
              perform vault.create_secret(generated_secret, 'tochka_sync_secret', 'Секрет вызова tochka_sync из pg_cron');
            else
              perform vault.update_secret(existing_id, generated_secret, 'tochka_sync_secret', 'Секрет вызова tochka_sync из pg_cron');
            end if;
          end
          \$vault\$;"
          vault_request="${RUNNER_TEMP}/vault-secret-request.json"
          vault_response="${RUNNER_TEMP}/vault-secret-response.json"
          vault_read_request="${RUNNER_TEMP}/vault-secret-read-request.json"
          vault_read_response="${RUNNER_TEMP}/vault-secret-read-response.json"
          edge_request="${RUNNER_TEMP}/edge-secret-request.json"
          edge_response="${RUNNER_TEMP}/edge-secret-response.json"
          sync_response="${RUNNER_TEMP}/tochka-sync-response.json"
          trap 'rm -f "${vault_request}" "${vault_response}" "${vault_read_request}" "${vault_read_response}" "${edge_request}" "${edge_response}" "${sync_response}"' EXIT
          jq -n --arg query "${vault_query}" '{query: $query}' > "${vault_request}"

          vault_status="$(curl --silent --show-error \
            --output "${vault_response}" \
            --write-out '%{http_code}' \
            --request POST \
            --url "${database_url}" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary "@${vault_request}")"

          if [[ "${vault_status}" != "201" ]]; then
            echo "Не удалось обновить секрет в Vault: Management API вернул HTTP ${vault_status}. Повторный запуск безопасно завершит ротацию." >&2
            exit 1
          fi

          vault_read_query="select decrypted_secret from vault.decrypted_secrets where name = 'tochka_sync_secret';"
          jq -n --arg query "${vault_read_query}" '{query: $query}' > "${vault_read_request}"
          vault_read_status="$(curl --silent --show-error \
            --output "${vault_read_response}" \
            --write-out '%{http_code}' \
            --request POST \
            --url "${database_url}" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary "@${vault_read_request}")"

          if [[ "${vault_read_status}" != "201" ]]; then
            echo "Не удалось безопасно прочитать новый секрет из Vault: Management API вернул HTTP ${vault_read_status}." >&2
            exit 1
          fi

          if ! tochka_sync_secret="$(jq -er '
            if type == "array" and length == 1 then .[0].decrypted_secret else empty end
          ' "${vault_read_response}")"; then
            echo "Vault не вернул единственное значение секрета." >&2
            exit 1
          fi
          if [[ ! "${tochka_sync_secret}" =~ ^[a-f0-9]{64}$ ]]; then
            echo "Vault вернул секрет неверного формата." >&2
            exit 1
          fi
          echo "::add-mask::${tochka_sync_secret}"

          jq -n --arg value "${tochka_sync_secret}" \
            '[{name: "TOCHKA_SYNC_SECRET", value: $value}]' > "${edge_request}"
          edge_status="$(curl --silent --show-error \
            --output "${edge_response}" \
            --write-out '%{http_code}' \
            --request POST \
            --url "${management_url}/secrets" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary "@${edge_request}")"

          if [[ "${edge_status}" != "201" ]]; then
            echo "Не удалось обновить Edge Function Secret: Management API вернул HTTP ${edge_status}. Повторный запуск безопасно завершит ротацию." >&2
            exit 1
          fi

          migration_files=(
            "supabase/migrations/002_schedule_tochka_sync.sql"
            "supabase/migrations/003_tochka_sync_lease.sql"
            "supabase/migrations/005_process_bank_transaction.sql"
          )
          migration_request="${RUNNER_TEMP}/migration-request.json"
          migration_response="${RUNNER_TEMP}/migration-response.json"
          migration_query=""
          for migration_file in "${migration_files[@]}"; do
            test -s "${migration_file}"
            migration_query+="$(<"${migration_file}")"$'\n'
          done
          jq -n --arg query "${migration_query}" '{query: $query}' > "${migration_request}"

          migration_status="$(curl --silent --show-error \
            --output "${migration_response}" \
            --write-out '%{http_code}' \
            --request POST \
            --url "${database_url}" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary "@${migration_request}")"

          if [[ "${migration_status}" != "201" ]]; then
            echo "Секреты обновлены, но cron не удалось обновить: Management API вернул HTTP ${migration_status}. Повторите workflow." >&2
            exit 1
          fi

          verification_query="select (select count(*) from vault.decrypted_secrets where name = 'tochka_sync_secret' and length(decrypted_secret) = 64)::integer as vault_secret_count, (select count(*) from pg_proc where proname in ('acquire_tochka_sync_lease', 'release_tochka_sync_lease'))::integer as lease_function_count, count(*) filter (where active and schedule = '5 * * * *' and position('vault.decrypted_secrets' in command) > 0 and position('X-Tochka-Sync-Secret' in command) > 0)::integer as secure_job_count from cron.job where jobname = 'tochka-sync-hourly';"
          verification_request="${RUNNER_TEMP}/verification-request.json"
          verification_response="${RUNNER_TEMP}/verification-response.json"
          jq -n --arg query "${verification_query}" '{query: $query}' > "${verification_request}"

          verification_status="$(curl --silent --show-error \
            --output "${verification_response}" \
            --write-out '%{http_code}' \
            --request POST \
            --url "${database_url}" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary "@${verification_request}")"

          if [[ "${verification_status}" != "201" ]] || ! jq -e '
            type == "array" and
            length == 1 and
            (.[0].vault_secret_count | tonumber) == 1 and
            (.[0].lease_function_count | tonumber) == 2 and
            (.[0].secure_job_count | tonumber) == 1
          ' "${verification_response}" > /dev/null; then
            echo "Проверка конфигурации не пройдена; значение секрета не выводилось." >&2
            exit 1
          fi

          if ! sync_status="$(curl --silent --show-error \
            --max-time 180 \
            --output "${sync_response}" \
            --write-out '%{http_code}' \
            --request POST \
            --url "https://${SUPABASE_PROJECT_ID}.supabase.co/functions/v1/api" \
            --header "Content-Type: application/json" \
            --header "X-Tochka-Sync-Secret: ${tochka_sync_secret}" \
            --data '{"action":"tochka_sync","days":30}')"; then
            echo "Защищённый проверочный запуск синхронизации Точки не ответил за 180 секунд." >&2
            exit 1
          fi

          if [[ "${sync_status}" != "200" ]] || ! jq -e '.ok == true' "${sync_response}" > /dev/null; then
            echo "Защищённый проверочный запуск синхронизации Точки завершился ошибкой HTTP ${sync_status}; содержимое ответа не выводилось." >&2
            exit 1
          fi

          sync_summary="$(jq -c '{added, outcome, diagnostics}' "${sync_response}")"
          echo "Edge Function Secret, Vault и защищённый cron настроены. Проверочная синхронизация: ${sync_summary}"
